<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Email Sender Bot{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<header>
  <strong>Email Sender Bot</strong>
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/leads" class="{{ 'active' if request.url.path.startswith('/leads') }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.3"/><path d="M5.2 20c1-4 3.8-6 6.8-6s5.8 2 6.8 6"/></svg>
      <span>Leads</span>
    </a>
    <a href="/campaigns" class="{{ 'active' if request.url.path.startswith('/campaigns') }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-8-8 18-2.2-7.8L3 11z"/></svg>
      <span>Campaigns</span>
    </a>
    <a href="/templates" class="{{ 'active' if request.url.path.startswith('/templates') }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>Templates</span>
    </a>
    <a href="/country-windows" class="{{ 'active' if request.url.path == '/country-windows' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.8 2.8 15.2 0 18M12 3c-2.8 2.8-2.8 15.2 0 18"/></svg>
      <span>Country windows</span>
    </a>
    <a href="/followups" class="{{ 'active' if request.url.path == '/followups' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 3.2"/></svg>
      <span>Follow-ups</span>{% if followups_due %}<span class="count">{{ followups_due }}</span>{% endif %}
    </a>
    <a href="/inboxes" class="{{ 'active' if request.url.path == '/inboxes' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <span>Inboxes</span>
    </a>
    <a href="/suppression" class="{{ 'active' if request.url.path == '/suppression' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 19 6v6c0 5-3 7.8-7 8.5-4-.7-7-3.5-7-8.5V6l7-2.5z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>
      <span>Suppression</span>
    </a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <form method="post" action="/logout" class="inline"><button>Log out</button></form>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
