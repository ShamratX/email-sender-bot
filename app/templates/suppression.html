{% extends "base.html" %}
{% block body %}
<div class="page-head"><h1>Suppression ({{ total }})</h1></div>
<p class="note">Permanent &mdash; no delete/edit here. To remove one, edit <code>state/sender.db</code> directly.</p>
<form method="get" class="inline"><input type="text" name="q" value="{{ q }}" placeholder="search"><button>Search</button></form>
<div class="card">
<form method="post" action="/suppression">
  <label>Add addresses (one per line)<textarea name="emails" rows="4"></textarea></label>
  <label>Reason<select name="reason">
    <option value="manual">manual</option><option value="unsubscribe">unsubscribe</option>
    <option value="hard_bounce">hard bounce</option><option value="complaint">complaint</option>
    <option value="replied">replied</option></select></label>
  <button>Add</button>
</form>
</div>
<div class="card">
<table>
<tr><th>Email</th><th>Reason</th><th>When</th></tr>
{% for row in rows %}
<tr><td>{{ row.email }}</td>
    <td><span class="pill {{ 'bad' if row.reason in ('hard_bounce', 'complaint') else ('warn' if row.reason == 'unsubscribe' else 'info') }}">{{ row.reason }}</span></td>
    <td class="muted">{{ row.created_at }}</td></tr>
{% else %}
<tr><td colspan="3" class="muted">Empty.</td></tr>
{% endfor %}
</table>
</div>
{% endblock %}
